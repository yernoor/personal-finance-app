name: Wallet Logger release

# Push a tag like wallet-logger-v0.1.0 to publish the signed logger APK as a GitHub PRE-release.
# It is a pre-release on purpose: the main app's update check reads releases/latest, which skips pre-releases.
on:
  push:
    tags: ['wallet-logger-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Tag must match versionName
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' walletlogger/build.gradle.kts)
          if [ "wallet-logger-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version in walletlogger/build.gradle.kts"; exit 1
          fi
      - name: Accept SDK licenses and install the compile SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.0"
      - run: ./gradlew :walletlogger:testDebugUnitTest
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret RELEASE_KEYSTORE_BASE64 is not set (see docs/RELEASING.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :walletlogger:assembleRelease
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp walletlogger/build/outputs/apk/release/walletlogger-release.apk "wallet-logger-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "wallet-logger-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --prerelease --notes "Research logger for Wallet payment notifications (docs/WALLET_LOGGER.md). Installs beside the main app."
